<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <rect width="600" height="780" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <!-- Header Bar -->
  <rect x="0" y="0" width="600" height="8" fill="#4f46e5" rx="4"/>
  <!-- Company Title -->
  <rect x="40" y="40" width="180" height="24" rx="4" fill="#1e293b"/>
  <rect x="40" y="70" width="130" height="12" rx="3" fill="#94a3b8"/>
  <rect x="40" y="88" width="150" height="12" rx="3" fill="#cbd5e1"/>
  <!-- Invoice Tag -->
  <rect x="420" y="40" width="140" height="30" rx="4" fill="#eff6ff"/>
  <text x="490" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f46e5" text-anchor="middle">TAX INVOICE</text>
  <rect x="440" y="80" width="120" height="12" rx="3" fill="#cbd5e1"/>
  <rect x="440" y="98" width="120" height="12" rx="3" fill="#e2e8f0"/>
  <!-- Line -->
  <line x1="40" y1="130" x2="560" y2="130" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Bill To & Ship To Boxes -->
  <rect x="40" y="145" width="240" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="55" y="155" width="70" height="12" rx="2" fill="#64748b"/>
  <rect x="55" y="175" width="150" height="14" rx="3" fill="#1e293b"/>
  <rect x="55" y="195" width="180" height="10" rx="2" fill="#94a3b8"/>
  <rect x="55" y="210" width="120" height="10" rx="2" fill="#94a3b8"/>

  <rect x="320" y="145" width="240" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="335" y="155" width="80" height="12" rx="2" fill="#64748b"/>
  <rect x="335" y="175" width="140" height="14" rx="3" fill="#1e293b"/>
  <rect x="335" y="195" width="170" height="10" rx="2" fill="#94a3b8"/>
  <rect x="335" y="210" width="110" height="10" rx="2" fill="#94a3b8"/>
  <!-- Items Table Header -->
  <rect x="40" y="255" width="520" height="32" rx="4" fill="#f1f5f9"/>
  <rect x="55" y="265" width="30" height="12" rx="2" fill="#475569"/>
  <rect x="110" y="265" width="120" height="12" rx="2" fill="#475569"/>
  <rect x="290" y="265" width="45" height="12" rx="2" fill="#475569"/>
  <rect x="370" y="265" width="55" height="12" rx="2" fill="#475569"/>
  <rect x="490" y="265" width="55" height="12" rx="2" fill="#475569"/>
  <!-- Row 1 -->
  <line x1="40" y1="325" x2="560" y2="325" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="55" y="300" width="20" height="12" rx="2" fill="#cbd5e1"/>
  <rect x="110" y="300" width="140" height="12" rx="2" fill="#334155"/>
  <rect x="295" y="300" width="30" height="12" rx="2" fill="#64748b"/>
  <rect x="375" y="300" width="45" height="12" rx="2" fill="#64748b"/>
  <rect x="495" y="300" width="50" height="12" rx="2" fill="#334155"/>
  <!-- Row 2 -->
  <line x1="40" y1="365" x2="560" y2="365" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="55" y="340" width="20" height="12" rx="2" fill="#cbd5e1"/>
  <rect x="110" y="340" width="110" height="12" rx="2" fill="#334155"/>
  <rect x="295" y="340" width="30" height="12" rx="2" fill="#64748b"/>
  <rect x="375" y="340" width="45" height="12" rx="2" fill="#64748b"/>
  <rect x="495" y="340" width="50" height="12" rx="2" fill="#334155"/>
  <!-- Row 3 -->
  <line x1="40" y1="405" x2="560" y2="405" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="55" y="380" width="20" height="12" rx="2" fill="#cbd5e1"/>
  <rect x="110" y="380" width="160" height="12" rx="2" fill="#334155"/>
  <rect x="295" y="380" width="30" height="12" rx="2" fill="#64748b"/>
  <rect x="375" y="380" width="45" height="12" rx="2" fill="#64748b"/>
  <rect x="495" y="380" width="50" height="12" rx="2" fill="#334155"/>
  <!-- Totals Section -->
  <rect x="340" y="430" width="220" height="140" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="360" y="445" width="70" height="10" rx="2" fill="#64748b"/>
  <rect x="490" y="445" width="50" height="10" rx="2" fill="#64748b"/>
  <rect x="360" y="470" width="80" height="10" rx="2" fill="#64748b"/>
  <rect x="490" y="470" width="50" height="10" rx="2" fill="#64748b"/>
  <line x1="355" y1="500" x2="545" y2="500" stroke="#cbd5e1" stroke-dasharray="2,2"/>
  <rect x="360" y="525" width="85" height="14" rx="2" fill="#1e293b"/>
  <rect x="480" y="520" width="65" height="20" rx="3" fill="#4f46e5"/>
  <!-- Bank Details & Footer -->
  <rect x="40" y="440" width="260" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="55" y="455" width="100" height="12" rx="2" fill="#475569"/>
  <rect x="55" y="475" width="160" height="10" rx="2" fill="#94a3b8"/>
  <rect x="55" y="492" width="140" height="10" rx="2" fill="#94a3b8"/>
  <rect x="55" y="510" width="120" height="10" rx="2" fill="#94a3b8"/>
  <!-- Signature -->
  <rect x="400" y="660" width="160" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4,4"/>
  <text x="480" y="690" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Authorized Signature</text>
  <rect x="40" y="740" width="250" height="10" rx="2" fill="#cbd5e1"/>
</svg>
