  <rect x="55" y="193" width="180" height="10" rx="2" fill="#64748b"/>
  <rect x="55" y="209" width="130" height="10" rx="2" fill="#64748b"/>

  <rect x="315" y="140" width="245" height="90" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
