<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <rect width="600" height="780" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <!-- Minimal Header (Clean, Light border line) -->
  <rect x="40" y="45" width="180" height="22" rx="3" fill="#18181b"/>
  <rect x="40" y="75" width="150" height="11" rx="2" fill="#71717a"/>
  <rect x="40" y="92" width="130" height="11" rx="2" fill="#a1a1aa"/>
  <!-- Invoice Text minimal -->
  <text x="560" y="65" font-family="sans-serif" font-size="20" font-weight="300" fill="#18181b" text-anchor="end" letter-spacing="2">INVOICE</text>
  <rect x="470" y="78" width="90" height="11" rx="2" fill="#71717a"/>
  <rect x="490" y="94" width="70" height="11" rx="2" fill="#a1a1aa"/>
  
  <line x1="40" y1="125" x2="560" y2="125" stroke="#18181b" stroke-width="2"/>

  <!-- Bill To Section Clean -->
  <text x="40" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#71717a">BILLED TO</text>
  <rect x="40" y="168" width="150" height="14" rx="2" fill="#18181b"/>
  <rect x="40" y="188" width="200" height="10" rx="2" fill="#71717a"/>
  <rect x="40" y="203" width="160" height="10" rx="2" fill="#a1a1aa"/>

  <text x="320" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#71717a">SHIPPED TO</text>
  <rect x="320" y="168" width="150" height="14" rx="2" fill="#18181b"/>
  <rect x="320" y="188" width="200" height="10" rx="2" fill="#71717a"/>
  <rect x="320" y="203" width="160" height="10" rx="2" fill="#a1a1aa"/>

  <!-- Items Table Header Minimal lines -->
  <line x1="40" y1="245" x2="560" y2="245" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="45" y="255" width="25" height="12" rx="2" fill="#71717a"/>
  <rect x="100" y="255" width="100" height="12" rx="2" fill="#71717a"/>
  <rect x="300" y="255" width="40" height="12" rx="2" fill="#71717a"/>
  <rect x="400" y="255" width="45" height="12" rx="2" fill="#71717a"/>
  <rect x="500" y="255" width="50" height="12" rx="2" fill="#71717a"/>
  <line x1="40" y1="277" x2="560" y2="277" stroke="#18181b" stroke-width="1.5"/>

  <!-- Row 1 -->
  <rect x="45" y="295" width="18" height="12" rx="2" fill="#a1a1aa"/>
  <rect x="100" y="295" width="150" height="12" rx="2" fill="#18181b"/>
  <rect x="305" y="295" width="30" height="12" rx="2" fill="#71717a"/>
  <rect x="405" y="295" width="40" height="12" rx="2" fill="#71717a"/>
  <rect x="500" y="295" width="50" height="12" rx="2" fill="#18181b"/>
  <line x1="40" y1="320" x2="560" y2="320" stroke="#f4f4f5" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="45" y="335" width="18" height="12" rx="2" fill="#a1a1aa"/>
  <rect x="100" y="335" width="120" height="12" rx="2" fill="#18181b"/>
  <rect x="305" y="335" width="30" height="12" rx="2" fill="#71717a"/>
  <rect x="405" y="335" width="40" height="12" rx="2" fill="#71717a"/>
  <rect x="500" y="335" width="50" height="12" rx="2" fill="#18181b"/>
  <line x1="40" y1="360" x2="560" y2="360" stroke="#f4f4f5" stroke-width="1"/>

  <!-- Row 3 -->
  <rect x="45" y="375" width="18" height="12" rx="2" fill="#a1a1aa"/>
  <rect x="100" y="375" width="170" height="12" rx="2" fill="#18181b"/>
  <rect x="305" y="375" width="30" height="12" rx="2" fill="#71717a"/>
  <rect x="405" y="375" width="40" height="12" rx="2" fill="#71717a"/>
  <rect x="500" y="375" width="50" height="12" rx="2" fill="#18181b"/>
  <line x1="40" y1="400" x2="560" y2="400" stroke="#e4e4e7" stroke-width="1"/>

  <!-- Totals Section Clean Borderless -->
  <rect x="360" y="430" width="80" height="11" rx="2" fill="#71717a"/>
  <rect x="490" y="430" width="60" height="11" rx="2" fill="#71717a"/>
  <rect x="360" y="455" width="90" height="11" rx="2" fill="#71717a"/>
  <rect x="490" y="455" width="60" height="11" rx="2" fill="#71717a"/>
  <line x1="360" y1="480" x2="560" y2="480" stroke="#18181b" stroke-width="1"/>
  <rect x="360" y="500" width="80" height="14" rx="2" fill="#18181b"/>
  <rect x="470" y="496" width="80" height="20" rx="3" fill="#18181b"/>

  <!-- Bank details simple -->
  <text x="40" y="445" font-family="sans-serif" font-size="11" font-weight="700" fill="#71717a">PAYMENT DETAILS</text>
  <rect x="40" y="460" width="180" height="10" rx="2" fill="#a1a1aa"/>
  <rect x="40" y="478" width="160" height="10" rx="2" fill="#a1a1aa"/>
  <rect x="40" y="496" width="140" height="10" rx="2" fill="#a1a1aa"/>

  <!-- Signature line -->
  <line x1="400" y1="690" x2="550" y2="690" stroke="#18181b" stroke-width="1"/>
  <text x="475" y="710" font-family="sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Authorized Signatory</text>
</svg>
